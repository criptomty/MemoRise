<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoRise picture library</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#F4F8FD;color:#123B82}h1{font-size:22px;margin:0 0 4px}p{margin:0 0 12px;color:#5B6B8C}
input{width:100%;max-width:420px;padding:10px 14px;border:2px solid #D5E2F3;border-radius:12px;font-size:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.c{background:#fff;border:2px solid #E3ECF7;border-radius:14px;padding:8px;text-align:center;font-size:13px;font-weight:700}.c img{width:84px;height:84px;display:block;margin:0 auto 6px}</style></head>
<body><h1>MemoRise picture library</h1><p id="n">Loading…</p><input id="q" placeholder="Search an English meaning…" oninput="draw()"><div class="g" id="g"></div>
<script>let L={};fetch('illib.json').then(r=>r.json()).then(j=>{L=j.lib||j;draw()});
function draw(){const q=document.getElementById('q').value.trim().toLowerCase(),k=Object.keys(L).filter(x=>!q||x.includes(q));document.getElementById('n').textContent=k.length+' of '+Object.keys(L).length+' pictures · one picture per English meaning, shared by every course';
document.getElementById('g').innerHTML=k.slice(0,400).map(x=>`<div class="c"><img alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(L[x])}">${x.replace(/</g,'&lt;')}</div>`).join('')}</script></body></html>
